name: Build bitFocus Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: bitFocus v1.0.${{ github.run_number }}
          body: |
            **bitFocus**: calm tools for focus, urges, and rough moments. Built for anyone.
            - Rounded Material You design with five color styles (in Settings)
            - Reset timer, Urge shield, one-step Focus sprints, and Patterns tracker
            - Renameable tabs, full reset options, everything saved on-device
            - Optional now-playing music bar with a full-screen swipe-down player
            - Pixel Trail: a pixel-art walk with your pet (tutorial included)
          files: build/app/outputs/flutter-apk/app-release.apk
